version: 2.1

jobs:
  verify:
    docker:
      - image: cimg/python:3.12
    resource_class: small
    steps:
      - checkout
      - run:
          name: Validate project files
          command: |
            bash -n scripts/custom-start.sh
            python3 -m json.tool pins.json >/dev/null
            python3 -m py_compile scripts/validate.py
            python3 scripts/validate.py

  publish:
    machine:
      image: ubuntu-2404:current
    resource_class: large
    environment:
      DOCKER_BUILDKIT: "1"
    steps:
      - checkout
      - run:
          name: Validate release configuration
          command: |
            [[ "${CIRCLE_TAG:-}" =~ ^v[1-9][0-9]*$ ]] || { echo 'Release tag must be vN, for example v1'; exit 2; }
            for name in DOCKERHUB_USERNAME DOCKERHUB_TOKEN; do
              test -n "${!name:-}" || { echo "$name is required"; exit 2; }
            done
            base_image="$(python3 -c "import json; print(json.load(open('pins.json'))['base_image'])")"
            docker_image="$(python3 -c "import json; print(json.load(open('pins.json'))['docker_image'])")"
            IMAGE_TAG="cu130-${CIRCLE_TAG}"
            ROLLING_TAG="cu130-latest"
            {
              echo "export BASE_IMAGE='$base_image'"
              echo "export DOCKER_IMAGE='$docker_image'"
              echo "export IMAGE_TAG='$IMAGE_TAG'"
              echo "export ROLLING_TAG='$ROLLING_TAG'"
            } >> "$BASH_ENV"
      - run:
          name: Log in to Docker Hub
          command: echo "$DOCKERHUB_TOKEN" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin
      - run:
          name: Build image
          no_output_timeout: 45m
          command: |
            docker build \
              --pull \
              --platform linux/amd64 \
              --progress=plain \
              --build-arg "BASE_IMAGE=$BASE_IMAGE" \
              --tag "$DOCKER_IMAGE:$IMAGE_TAG" \
              --tag "$DOCKER_IMAGE:$ROLLING_TAG" \
              .
      - run:
          name: Push immutable and rolling tags
          no_output_timeout: 30m
          command: |
            docker push "$DOCKER_IMAGE:$IMAGE_TAG"
            docker push "$DOCKER_IMAGE:$ROLLING_TAG"

workflows:
  verify-and-publish:
    jobs:
      - verify:
          filters: pipeline.git.branch == "main" or pipeline.git.tag matches /^v[1-9][0-9]*$/
      - publish:
          requires:
            - verify
          filters: pipeline.git.tag matches /^v[1-9][0-9]*$/
